<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copero · Minijuegos</title>
  <link rel="stylesheet" href="minigame-firstperson.css">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #06080c;
      --panel: rgba(13, 17, 24, .88);
      --text: #f4f7fb;
      --muted: #8993a3;
      --border: rgba(255,255,255,.09);
      --green: #46d296;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% -10%, rgba(70,210,150,.08), transparent 35%),
        linear-gradient(180deg, #080b10 0%, #05070a 100%);
      z-index: -2;
    }

    .page {
      width: min(1080px, 100%);
      margin: auto;
      padding: 34px 20px 60px;
    }

    /* =========================
       HEADER
       ========================= */

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
      color: #687384;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px rgba(70,210,150,.8);
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 42px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .sub {
      max-width: 620px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .game-status {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
      color: #8f99a8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .game-status.active {
      color: #b8f5d9;
      border-color: rgba(70,210,150,.28);
      background: rgba(70,210,150,.07);
    }

    /* =========================
       VARIANT SELECTOR
       ========================= */

    .variant-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .variant-buttons button {
      position: relative;
      min-height: 94px;
      padding: 17px 18px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 15px;
      background: #0d1118;
      color: #e9edf3;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .variant-buttons button::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .variant-buttons button:hover {
      transform: translateY(-2px);
    }

    .variant-buttons button.tunnel {
      border-color: rgba(209,53,72,.2);
    }

    .variant-buttons button.tunnel::before {
      background:
        radial-gradient(circle at 90% 0%, rgba(230,45,67,.24), transparent 45%),
        linear-gradient(135deg, rgba(112,19,32,.18), transparent);
    }

    .variant-buttons button.tunnel:hover,
    .variant-buttons button.tunnel.active {
      border-color: rgba(230,45,67,.55);
      box-shadow: 0 10px 40px rgba(190,27,49,.14);
    }

    .variant-buttons button.rain {
      border-color: rgba(75,151,218,.2);
    }

    .variant-buttons button.rain::before {
      background:
        radial-gradient(circle at 90% 0%, rgba(74,153,221,.24), transparent 45%),
        linear-gradient(135deg, rgba(35,83,125,.18), transparent);
    }

    .variant-buttons button.rain:hover,
    .variant-buttons button.rain.active {
      border-color: rgba(82,166,235,.55);
      box-shadow: 0 10px 40px rgba(40,117,180,.14);
    }

    .variant-buttons button:hover::before,
    .variant-buttons button.active::before {
      opacity: 1;
    }

    .variant-icon {
      position: relative;
      z-index: 1;
      display: block;
      margin-bottom: 8px;
      font-size: 22px;
    }

    .variant-title {
      position: relative;
      z-index: 1;
      display: block;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: -.01em;
    }

    .variant-description {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 4px;
      color: #7d8795;
      font-size: 11px;
    }

    #btn-close {
      display: none;
    }

    /* =========================
       GAME CONTAINER
       ========================= */

    #stage {
      position: relative;
      min-height: 470px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      background: #080b10;
      overflow: hidden;
      box-shadow:
        0 25px 80px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.025);
    }

    #stage .empty {
      min-height: 470px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px;
      color: #6e7887;
      text-align: center;
      font-size: 13px;
    }

    #stage .empty::before {
      content: "⚡";
      display: block;
      margin-bottom: 15px;
      font-size: 30px;
      opacity: .5;
    }

    /* =========================
       OUTCOME
       ========================= */

    #outcome {
      position: relative;
      margin-top: 14px;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      background: rgba(12,16,22,.94);
      box-shadow: 0 15px 50px rgba(0,0,0,.22);
      display: none;
      animation: outcomeIn .35s ease;
    }

    #outcome.show {
      display: block;
    }

    #outcome .choques {
      color: #778293;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #outcome .mensaje {
      font-size: 18px;
      font-weight: 850;
      letter-spacing: -.02em;
      margin-bottom: 8px;
    }

    #outcome .deltas {
      color: #8993a2;
      font-size: 13px;
    }

    #outcome .deltas span {
      font-variant-numeric: tabular-nums;
    }

    .pos {
      color: #46d296;
    }

    .neg {
      color: #f47067;
    }

    @keyframes outcomeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 680px) {
      .page {
        padding: 22px 12px 40px;
      }

      .game-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .game-status {
        display: none;
      }

      .variant-buttons {
        grid-template-columns: 1fr;
      }

      .variant-buttons button {
        min-height: 78px;
      }

      #stage,
      #stage .empty {
        min-height: 400px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="game-header">
      <div>
        <div class="eyebrow">COPERO · EVENTOS</div>
        <h1>Minijuegos</h1>
        <p class="sub">
          Superá situaciones de partido, esquivá obstáculos y mantené el control.
        </p>
      </div>

      <div id="game-status" class="game-status">
        Seleccioná un evento
      </div>
    </header>

    <div class="variant-buttons">

      <button
        id="btn-tunnel"
        class="tunnel"
        type="button"
      >
        <span class="variant-icon">🏟️</span>
        <span class="variant-title">Roce con la barra brava</span>
        <span class="variant-description">
          Túnel del estadio · 6 segundos · alta presión
        </span>
      </button>

      <button
        id="btn-rain"
        class="rain"
        type="button"
      >
        <span class="variant-icon">🌧️</span>
        <span class="variant-title">Carrera bajo lluvia</span>
        <span class="variant-description">
          Camino al vestuario · 12 segundos · velocidad
        </span>
      </button>

    </div>

    <div id="stage">
      <div class="empty">
        Elegí un evento para comenzar
      </div>
    </div>

    <div id="outcome">
      <div class="choques" id="out-choques"></div>
      <div class="mensaje" id="out-mensaje"></div>
      <div class="deltas" id="out-deltas"></div>
    </div>

  </main>

  <script src="event-outcomes.js"></script>
  <script src="minigame-firstperson.js"></script>

  <script>
    (function () {
      "use strict";

      var stage = document.getElementById("stage");
      var outcome = document.getElementById("outcome");
      var status = document.getElementById("game-status");

      var btnTunnel = document.getElementById("btn-tunnel");
      var btnRain = document.getElementById("btn-rain");

      var instancia = null;

      var shapesTunnel = [
        { type: "person", colors: ["#d8b48a", "#8e2637"] },
        { type: "person", colors: ["#8a5a3a", "#38151d"] },
        { type: "person", colors: ["#e6c89c", "#742131"] },
        { type: "cam", colors: ["#23272e", "#b43b4e"] },
        { type: "mic", colors: ["#2e3238", "#e8e8ec"] }
      ];

      var shapesRain = [
        { type: "person", colors: ["#d8b48a", "#394452"] },
        { type: "car", colors: ["#b9533f", "#e8c05a"] },
        { type: "car", colors: ["#416b9d", "#9cc3e6"] },
        { type: "puddle", colors: ["#6fa5d0"] }
      ];

      function configTunnel(onFinish) {
        return {
          duration: 6000,
          obstacleInterval: 1200,
          obstacleIntervalReduction: 0.10,
          reductionEvery: 2,
          obstacleSpeed: 1000,
          obstacleSprites: null,
          obstacleShapes: shapesTunnel,

          background:
            "linear-gradient(to bottom, #09090e, #240d16)",

          showProgressBar: false,
          rainEffect: false,
          onFinish: onFinish
        };
      }

      function configRain(onFinish) {
        return {
          duration: 12000,
          obstacleInterval: 900,
          obstacleSpeed: 900,
          obstacleSprites: null,
          obstacleShapes: shapesRain,

          background:
            "linear-gradient(to bottom, #172537, #070b11)",

          showProgressBar: true,
          rainEffect: true,
          onFinish: onFinish
        };
      }

      function lanzar(config, resolver, varianteTexto, tipo) {

        if (instancia) {
          instancia.destroy();
          instancia = null;
        }

        stage.innerHTML = "";
        outcome.classList.remove("show");

        btnTunnel.classList.toggle("active", tipo === "tunnel");
        btnRain.classList.toggle("active", tipo === "rain");

        status.textContent =
          tipo === "tunnel"
            ? "EVENTO · TÚNEL"
            : "EVENTO · LLUVIA";

        status.classList.add("active");

        instancia = createFirstPersonDodge(
          config(function (choques) {

            var res = resolver(choques);

            mostrarResultado(choques, res, varianteTexto);

            instancia = null;
          })
        );
      }

      function mostrarResultado(choques, res, txt) {

        stage.innerHTML = "";

        var div = document.createElement("div");

        div.className = "empty";

        div.innerHTML =
          "<strong>" +
          txt +
          "</strong><br>" +
          choques +
          " choques registrados.";

        stage.appendChild(div);

        outcome.classList.add("show");

        var outChoques =
          document.getElementById("out-choques");

        var outMensaje =
          document.getElementById("out-mensaje");

        var outDeltas =
          document.getElementById("out-deltas");

        outChoques.textContent =
          "Resultado · " + choques + " choques";

        outMensaje.textContent =
          res && res.mensaje
            ? res.mensaje
            : "Evento completado";

        outDeltas.textContent =
          res && res.deltas
            ? res.deltas
            : "";
      }

      btnTunnel.addEventListener("click", function () {

        lanzar(
          configTunnel,
          resolveTunnelEvent,
          "Roce con la barra brava",
          "tunnel"
        );

      });

      btnRain.addEventListener("click", function () {

        lanzar(
          configRain,
          resolveLateRunEvent,
          "Carrera bajo lluvia",
          "rain"
        );

      });

    })();
  </script>

</body>
</html>
